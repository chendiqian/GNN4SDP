defaults:
  - default_exp
  - default_gnn
  - _self_
  # If you want your primary config to override the values of configs from the Defaults List,
  # append _self_ to the end of the Defaults List.

gnn:
  type: ppgn
  block_mlp_layers: 1
  layernorm: true
  no_mp: true  # we don't need mp for maxcut, which speed up
  no_dual: true  # we don't predict the dual variables

train:
  device: cpu